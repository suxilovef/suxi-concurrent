spring.application.name=concurrent

# ---------------------------------------------------------------------------
# 生产故障排查实验室（docs/05-05）
#
# ⚠️ 默认关闭，且必须保持关闭。
#    /lab/** 下的接口能注入死锁、CPU 空转、内存泄漏 —— 是"能打死服务"的接口。
#    默认关意味着 lab 包下的所有 bean 都不会注册，访问 /lab/** 直接 404。
#
# 演练时用命令行显式打开（而不是改这里的默认值），这样：
#   1) 每次启动日志里都留得下"这次开了 lab"的证据（可审计）；
#   2) 演练完重启即恢复安全状态，不依赖人记得改回来。
#
#   启动示例见 docs/05-05 或 scripts/lab/lab.sh
# ---------------------------------------------------------------------------
lab.enabled=false
lab.detector.enabled=true

# 空转线程数上限：服务器只有 4 核，不设上限的话手滑传个 100
# 会把整台机器打死，连 attach 排查的机会都没有
lab.cpu.max-threads=4
# BLOCKED 堆积场景的等待线程数上限
lab.blocked.max-waiters=32
# 内存泄漏场景的累计占用上限（MB），防止真的撑到 OOM 后没法观察
lab.leak.max-mb=512
